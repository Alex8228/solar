<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Интерактивная Солнечная система</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #050510; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }

.app { width: 100%; height: 100%; display: flex; flex-direction: column; }

.header {
  flex-shrink: 0;
  background: linear-gradient(to right, #0a1628, #1a1040);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 12px 24px;
  z-index: 10;
}
.header h1 { font-size: 22px; font-weight: bold; color: #fff; }
.header p { color: #9ca3af; font-size: 13px; margin-top: 4px; }

.main { flex: 1; display: flex; position: relative; overflow: hidden; }

.canvas-wrap { flex: 1; position: relative; min-width: 0; }
canvas { display: block; width: 100%; height: 100%; }

.controls {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(12px);
  border-radius: 999px;
  padding: 10px 20px;
  border: 1px solid rgba(255,255,255,0.12);
  z-index: 10;
  white-space: nowrap;
}

.btn-play {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  cursor: pointer;
  transition: background 0.2s;
  flex-shrink: 0;
}
.btn-play:hover { background: rgba(255,255,255,0.2); }

.speed-group { display: flex; align-items: center; gap: 8px; }
.speed-label { color: #9ca3af; font-size: 12px; }
.speed-value { color: #facc15; font-size: 14px; font-family: monospace; width: 40px; text-align: center; }

input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100px;
  height: 6px;
  background: linear-gradient(to right, #374151, #4b5563);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #facc15;
  cursor: pointer;
  box-shadow: 0 0 6px rgba(250,204,21,0.5);
}
input[type="range"]::-moz-range-thumb {
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #facc15;
  cursor: pointer;
  border: none;
}

.presets { display: flex; gap: 4px; }
.preset-btn {
  padding: 4px 8px;
  font-size: 12px;
  border-radius: 4px;
  background: rgba(255,255,255,0.05);
  color: #9ca3af;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s;
}
.preset-btn:hover { background: rgba(255,255,255,0.1); }
.preset-btn.active {
  background: rgba(250,204,21,0.15);
  color: #facc15;
  border-color: rgba(250,204,21,0.5);
}

.info-panel {
  width: 320px;
  flex-shrink: 0;
  background: linear-gradient(to bottom, #0a1628, #1a1040);
  border-left: 1px solid rgba(255,255,255,0.1);
  padding: 24px;
  overflow-y: auto;
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

.info-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.info-header h2 { font-size: 20px; font-weight: bold; color: #fff; }
.close-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 16px;
  transition: background 0.2s;
}
.close-btn:hover { background: rgba(255,255,255,0.2); }

.planet-visual { display: flex; justify-content: center; margin-bottom: 24px; }
.planet-sphere { border-radius: 50%; }
.planet-desc { color: #d1d5db; font-size: 14px; font-style: italic; margin-bottom: 24px; line-height: 1.5; }
.info-rows { display: flex; flex-direction: column; gap: 12px; }
.info-row {
  display: flex; align-items: flex-start; gap: 12px;
  background: rgba(255,255,255,0.05);
  border-radius: 8px; padding: 12px;
  border: 1px solid rgba(255,255,255,0.05);
}
.info-row .icon { font-size: 18px; margin-top: 2px; }
.info-row .label { color: #9ca3af; font-size: 12px; }
.info-row .value { color: #fff; font-size: 14px; font-weight: 500; }

.planet-order { margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.1); }
.planet-order p { color: #6b7280; font-size: 12px; margin-bottom: 12px; }
.order-dots { display: flex; gap: 6px; flex-wrap: wrap; }
.order-dot {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: bold;
  opacity: 0.5; cursor: pointer;
  transition: all 0.2s;
}
.order-dot:hover { opacity: 0.8; }
.order-dot.active { opacity: 1; transform: scale(1.1); box-shadow: 0 0 0 2px #facc15; }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

@media (max-width: 768px) {
  .info-panel { width: 100%; position: absolute; right: 0; top: 0; bottom: 0; z-index: 20; }
  .speed-label { display: none; }
  .controls { gap: 8px; padding: 8px 14px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>☀️ Интерактивная Солнечная система</h1>
    <p>Нажмите на планету, чтобы узнать подробности</p>
  </div>
  <div class="main">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="controls">
        <button class="btn-play" id="btnPlay" title="Пауза / Воспроизведение">
          <svg id="iconPause" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <rect x="3" y="2" width="4" height="12" rx="1"/>
            <rect x="9" y="2" width="4" height="12" rx="1"/>
          </svg>
          <svg id="iconPlay" width="16" height="16" viewBox="0 0 16 16" fill="currentColor" style="display:none">
            <path d="M4 2l10 6-10 6V2z"/>
          </svg>
        </button>
        <div class="speed-group">
          <span class="speed-label">Скорость:</span>
          <input type="range" id="speedRange" min="0.1" max="10" step="0.1" value="1">
          <span class="speed-value" id="speedValue">1.0x</span>
        </div>
        <div class="presets" id="presets">
          <button class="preset-btn" data-speed="0.5">0.5x</button>
          <button class="preset-btn active" data-speed="1">1x</button>
          <button class="preset-btn" data-speed="2">2x</button>
          <button class="preset-btn" data-speed="5">5x</button>
        </div>
      </div>
    </div>
    <div class="info-panel" id="infoPanel" style="display:none"></div>
  </div>
</div>

<script>
(function() {
  var planetsData = [
    { name:'Mercury', nameRu:'Меркурий', radius:4, orbitRadius:60, orbitalPeriod:88, realRadius:'2 439 км', distanceFromSun:'57,9 млн км', orbitalPeriodText:'88 дней', color:'#b5b5b5', description:'Самая маленькая и ближайшая к Солнцу планета. Поверхность покрыта кратерами, температура от −180°C до +430°C.' },
    { name:'Venus', nameRu:'Венера', radius:7, orbitRadius:95, orbitalPeriod:225, realRadius:'6 052 км', distanceFromSun:'108,2 млн км', orbitalPeriodText:'225 дней', color:'#e8cda0', description:'Самая горячая планета (+465°C) с плотной атмосферой из CO₂ и облаками из серной кислоты.' },
    { name:'Earth', nameRu:'Земля', radius:8, orbitRadius:135, orbitalPeriod:365, realRadius:'6 371 км', distanceFromSun:'149,6 млн км', orbitalPeriodText:'365,25 дней', color:'#4da6ff', description:'Наш дом — единственная известная планета с жидкой водой на поверхности и развитой жизнью.' },
    { name:'Mars', nameRu:'Марс', radius:5, orbitRadius:175, orbitalPeriod:687, realRadius:'3 390 км', distanceFromSun:'227,9 млн км', orbitalPeriodText:'687 дней', color:'#e07040', description:'Красная планета. Здесь находится Олимп — высочайший вулкан в Солнечной системе (21,9 км).' },
    { name:'Jupiter', nameRu:'Юпитер', radius:18, orbitRadius:240, orbitalPeriod:4333, realRadius:'69 911 км', distanceFromSun:'778,5 млн км', orbitalPeriodText:'11,86 лет', color:'#d4a574', description:'Крупнейшая планета — газовый гигант. Большое красное пятно — шторм, бушующий более 350 лет.' },
    { name:'Saturn', nameRu:'Сатурн', radius:15, orbitRadius:310, orbitalPeriod:10759, realRadius:'58 232 км', distanceFromSun:'1 434 млн км', orbitalPeriodText:'29,46 лет', color:'#e8d5a0', description:'Знаменита кольцами из частиц льда и камня шириной до 282 000 км при толщине всего ~10 м.' },
    { name:'Uranus', nameRu:'Уран', radius:11, orbitRadius:370, orbitalPeriod:30687, realRadius:'25 362 км', distanceFromSun:'2 871 млн км', orbitalPeriodText:'84,01 лет', color:'#7de8e8', description:'Ледяной гигант, вращающийся «на боку» — наклон оси 98°. Имеет 27 известных спутников.' },
    { name:'Neptune', nameRu:'Нептун', radius:10, orbitRadius:420, orbitalPeriod:60190, realRadius:'24 622 км', distanceFromSun:'4 495 млн км', orbitalPeriodText:'164,8 лет', color:'#4060e0', description:'Самая далёкая планета. Ветры достигают 2100 км/ч — рекорд в Солнечной системе.' }
  ];

  var planets = planetsData.map(function(p) { return Object.assign({}, p, {angle: Math.random() * Math.PI * 2}); });
  var isPlaying = true;
  var speed = 1;
  var selectedPlanet = null;
  var hoveredPlanet = null;
  var lastHoveredPlanetData = null; // Сохраняем данные планеты при наведении
  var lastTime = 0;
  var stars = [];

  var canvas = document.getElementById('canvas');
  var ctx = canvas.getContext('2d');
  var canvasWrap = document.getElementById('canvasWrap');
  var infoPanel = document.getElementById('infoPanel');
  var btnPlay = document.getElementById('btnPlay');
  var iconPause = document.getElementById('iconPause');
  var iconPlay = document.getElementById('iconPlay');
  var speedRange = document.getElementById('speedRange');
  var speedValue = document.getElementById('speedValue');
  var presets = document.getElementById('presets');

  function lightenColor(hex, amt) {
    var num = parseInt(hex.replace('#',''), 16);
    var r = Math.min(255, (num >> 16) + amt);
    var g = Math.min(255, ((num >> 8) & 0xff) + amt);
    var b = Math.min(255, (num & 0xff) + amt);
    return 'rgb('+r+','+g+','+b+')';
  }
  function darkenColor(hex, amt) {
    var num = parseInt(hex.replace('#',''), 16);
    var r = Math.max(0, (num >> 16) - amt);
    var g = Math.max(0, ((num >> 8) & 0xff) - amt);
    var b = Math.max(0, (num & 0xff) - amt);
    return 'rgb('+r+','+g+','+b+')';
  }

  function generateStars(w, h) {
    stars = [];
    var count = Math.max(100, Math.floor((w * h) / 3000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        size: Math.random() * 1.8 + 0.3,
        opacity: Math.random() * 0.7 + 0.3,
        twinkle: Math.random() * 0.003 + 0.001
      });
    }
  }

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvasWrap.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    generateStars(w, h);
  }

  // Используем ResizeObserver для отслеживания изменений размера canvasWrap
  // (например, при появлении/исчезновении информационной панели)
  if (typeof ResizeObserver !== 'undefined') {
    var ro = new ResizeObserver(function() {
      resize();
    });
    ro.observe(canvasWrap);
  }
  window.addEventListener('resize', resize);
  resize();

  function getCenter() {
    var rect = canvasWrap.getBoundingClientRect();
    return { x: rect.width / 2, y: rect.height / 2 };
  }

  function findPlanetAt(mx, my) {
    var c = getCenter();
    // Ищем с большим радиусом попадания для удобства
    for (var i = planets.length - 1; i >= 0; i--) {
      var p = planets[i];
      var px = c.x + Math.cos(p.angle) * p.orbitRadius;
      var py = c.y + Math.sin(p.angle) * p.orbitRadius;
      var dist = Math.sqrt((mx-px)*(mx-px) + (my-py)*(my-py));
      // Увеличенная зона попадания: радиус планеты + 15px
      if (dist <= p.radius + 15) return p;
    }
    return null;
  }

  // Используем mousedown вместо click для более надёжного срабатывания
  canvas.addEventListener('mousedown', function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    
    // Сначала пробуем найти планету по текущим координатам
    var p = findPlanetAt(mx, my);
    
    // Если не нашли, используем последнюю планету под курсором (из mousemove)
    if (!p && lastHoveredPlanetData) {
      p = lastHoveredPlanetData;
    }
    
    if (p) {
      selectedPlanet = Object.assign({}, p);
    } else {
      selectedPlanet = null;
    }
    renderInfoPanel();
  });

  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;
    var p = findPlanetAt(mx, my);
    
    if (p) {
      hoveredPlanet = p.name;
      lastHoveredPlanetData = p; // Сохраняем данные планеты
      canvas.style.cursor = 'pointer';
    } else {
      hoveredPlanet = null;
      // НЕ сбрасываем lastHoveredPlanetData сразу — даём шанс клику
      canvas.style.cursor = 'default';
    }
  });

  canvas.addEventListener('mouseleave', function() {
    hoveredPlanet = null;
    // Сбрасываем с задержкой, чтобы клик ещё мог сработать
    setTimeout(function() {
      if (!hoveredPlanet) {
        lastHoveredPlanetData = null;
      }
    }, 300);
  });

  btnPlay.addEventListener('click', function(e) {
    e.stopPropagation();
    isPlaying = !isPlaying;
    iconPause.style.display = isPlaying ? 'block' : 'none';
    iconPlay.style.display = isPlaying ? 'none' : 'block';
  });

  speedRange.addEventListener('input', function() {
    speed = parseFloat(this.value);
    speedValue.textContent = speed.toFixed(1) + 'x';
    updatePresets();
  });

  presets.addEventListener('click', function(e) {
    var btn = e.target.closest('.preset-btn');
    if (!btn) return;
    speed = parseFloat(btn.dataset.speed);
    speedRange.value = speed;
    speedValue.textContent = speed.toFixed(1) + 'x';
    updatePresets();
  });

  function updatePresets() {
    var btns = presets.querySelectorAll('.preset-btn');
    for (var i = 0; i < btns.length; i++) {
      if (parseFloat(btns[i].dataset.speed) === speed) {
        btns[i].classList.add('active');
      } else {
        btns[i].classList.remove('active');
      }
    }
  }

  function renderInfoPanel() {
    if (!selectedPlanet) {
      infoPanel.style.display = 'none';
      // После скрытия панели canvasWrap изменит размер, ResizeObserver вызовет resize()
      return;
    }
    infoPanel.style.display = 'block';
    var p = selectedPlanet;
    var sphereSize = Math.max(p.radius * 5, 80);

    var orderDots = '';
    for (var i = 0; i < planetsData.length; i++) {
      var pl = planetsData[i];
      var isActive = pl.name === p.name;
      orderDots += '<div class="order-dot' + (isActive ? ' active' : '') + '" data-name="'+pl.name+'" style="background-color:'+pl.color+'40;color:'+pl.color+'">'+(i+1)+'</div>';
    }

    infoPanel.innerHTML = 
      '<div class="info-header"><h2>'+p.nameRu+'</h2><button class="close-btn" id="closeInfo">✕</button></div>' +
      '<div class="planet-visual"><div class="planet-sphere" style="width:'+sphereSize+'px;height:'+sphereSize+'px;background:radial-gradient(circle at 35% 35%,'+lightenColor(p.color,60)+','+p.color+','+darkenColor(p.color,40)+');box-shadow:0 0 40px '+p.color+'50,0 0 80px '+p.color+'20"></div></div>' +
      '<p class="planet-desc">'+p.description+'</p>' +
      '<div class="info-rows">' +
        '<div class="info-row"><span class="icon">📏</span><div><div class="label">Радиус</div><div class="value">'+p.realRadius+'</div></div></div>' +
        '<div class="info-row"><span class="icon">🌞</span><div><div class="label">Расстояние от Солнца</div><div class="value">'+p.distanceFromSun+'</div></div></div>' +
        '<div class="info-row"><span class="icon">🔄</span><div><div class="label">Орбитальный период</div><div class="value">'+p.orbitalPeriodText+'</div></div></div>' +
        '<div class="info-row"><span class="icon">🌐</span><div><div class="label">Название (EN)</div><div class="value">'+p.name+'</div></div></div>' +
      '</div>' +
      '<div class="planet-order"><p>Порядок от Солнца:</p><div class="order-dots">'+orderDots+'</div></div>';

    document.getElementById('closeInfo').addEventListener('click', function(e) {
      e.stopPropagation();
      selectedPlanet = null;
      infoPanel.style.display = 'none';
    });

    var dots = infoPanel.querySelectorAll('.order-dot');
    for (var j = 0; j < dots.length; j++) {
      dots[j].addEventListener('click', function(e) {
        e.stopPropagation();
        var name = this.getAttribute('data-name');
        for (var k = 0; k < planetsData.length; k++) {
          if (planetsData[k].name === name) {
            selectedPlanet = Object.assign({}, planetsData[k]);
            renderInfoPanel();
            break;
          }
        }
      });
    }
  }

  function animate(timestamp) {
    if (!lastTime) lastTime = timestamp;
    var dt = timestamp - lastTime;
    lastTime = timestamp;

    var rect = canvasWrap.getBoundingClientRect();
    var w = rect.width;
    var h = rect.height;
    var cx = w / 2;
    var cy = h / 2;

    if (isPlaying) {
      for (var i = 0; i < planets.length; i++) {
        var angularSpeed = (2 * Math.PI) / (planets[i].orbitalPeriod * 60);
        planets[i].angle += angularSpeed * dt * speed;
      }
    }

    // Clear
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, w, h);

    // Stars with twinkle
    var time = timestamp * 0.001;
    for (var s = 0; s < stars.length; s++) {
      var star = stars[s];
      var twinkle = 0.5 + 0.5 * Math.sin(time * star.twinkle * 1000);
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,' + (star.opacity * twinkle) + ')';
      ctx.fill();
    }

    // Sun outer glow
    var sunGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 80);
    sunGlow.addColorStop(0, 'rgba(255,200,50,0.3)');
    sunGlow.addColorStop(0.5, 'rgba(255,150,0,0.1)');
    sunGlow.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, 80, 0, Math.PI * 2);
    ctx.fillStyle = sunGlow;
    ctx.fill();

    // Sun body
    var sunGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 30);
    sunGrad.addColorStop(0, '#ffffff');
    sunGrad.addColorStop(0.2, '#fffde0');
    sunGrad.addColorStop(0.5, '#ffcc00');
    sunGrad.addColorStop(0.8, '#ff9900');
    sunGrad.addColorStop(1, '#ff6600');
    ctx.beginPath();
    ctx.arc(cx, cy, 30, 0, Math.PI * 2);
    ctx.fillStyle = sunGrad;
    ctx.fill();

    // Orbits
    for (var o = 0; o < planets.length; o++) {
      var op = planets[o];
      var oActive = hoveredPlanet === op.name || (selectedPlanet && selectedPlanet.name === op.name);
      ctx.beginPath();
      ctx.arc(cx, cy, op.orbitRadius, 0, Math.PI * 2);
      ctx.strokeStyle = oActive ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.08)';
      ctx.lineWidth = oActive ? 1.5 : 0.7;
      ctx.setLineDash(oActive ? [] : [4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Planets
    for (var pi = 0; pi < planets.length; pi++) {
      var p = planets[pi];
      var px = cx + Math.cos(p.angle) * p.orbitRadius;
      var py = cy + Math.sin(p.angle) * p.orbitRadius;
      var pActive = hoveredPlanet === p.name || (selectedPlanet && selectedPlanet.name === p.name);

      // Glow
      if (pActive) {
        var glow = ctx.createRadialGradient(px, py, p.radius, px, py, p.radius * 3);
        glow.addColorStop(0, p.color + '60');
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.beginPath();
        ctx.arc(px, py, p.radius * 3, 0, Math.PI * 2);
        ctx.fillStyle = glow;
        ctx.fill();
      }

      // Body
      var pGrad = ctx.createRadialGradient(px - p.radius*0.3, py - p.radius*0.3, 0, px, py, p.radius);
      pGrad.addColorStop(0, lightenColor(p.color, 60));
      pGrad.addColorStop(0.7, p.color);
      pGrad.addColorStop(1, darkenColor(p.color, 40));
      ctx.beginPath();
      ctx.arc(px, py, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = pGrad;
      ctx.fill();

      // Saturn rings
      if (p.name === 'Saturn') {
        ctx.beginPath();
        ctx.ellipse(px, py, p.radius*2.2, p.radius*0.5, -0.3, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(210,180,120,0.7)';
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.beginPath();
        ctx.ellipse(px, py, p.radius*1.8, p.radius*0.4, -0.3, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(180,150,100,0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Earth moon
      if (p.name === 'Earth') {
        var moonAngle = p.angle * 13;
        var moonDist = p.radius + 8;
        var mx = px + Math.cos(moonAngle) * moonDist;
        var my = py + Math.sin(moonAngle) * moonDist;
        ctx.beginPath();
        ctx.arc(mx, my, 2, 0, Math.PI*2);
        ctx.fillStyle = '#cccccc';
        ctx.fill();
      }

      // Jupiter bands
      if (p.name === 'Jupiter') {
        ctx.save();
        ctx.beginPath();
        ctx.arc(px, py, p.radius, 0, Math.PI*2);
        ctx.clip();
        for (var bi = -3; bi <= 3; bi++) {
          ctx.beginPath();
          ctx.moveTo(px - p.radius, py + bi*5);
          ctx.lineTo(px + p.radius, py + bi*5);
          ctx.strokeStyle = bi%2===0 ? 'rgba(180,120,60,0.3)' : 'rgba(200,160,100,0.2)';
          ctx.lineWidth = 2;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.ellipse(px+5, py+3, 4, 3, 0, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(200,80,50,0.5)';
        ctx.fill();
        ctx.restore();
      }

      // Label
      if (pActive) {
        ctx.font = 'bold 12px Arial, sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.8)';
        ctx.shadowBlur = 4;
        ctx.fillText(p.nameRu, px, py - p.radius - 10);
        ctx.shadowBlur = 0;
      }
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
